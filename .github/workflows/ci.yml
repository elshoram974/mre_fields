name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a new Flutter release that breaks the package shows up on its own.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces a run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze, test and docs (${{ matrix.channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: ${{ matrix.channel != 'stable' }}
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Web paste test (runs in a browser)
        run: flutter test --platform chrome test/src/attachments/paste/paste_events_web_test.dart
      - name: Guides match their snippets
        run: dart run tool/sync_doc_snippets.dart --check
      - name: API docs have no warnings
        run: |
          dart doc . 2>&1 | tee doc.log
          grep -q "Found 0 warnings and 0 errors" doc.log
      - name: Example app
        working-directory: example
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Publish dry run
        run: flutter pub publish --dry-run

  minimum:
    name: Minimum Flutter (3.38.1)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Example app
        working-directory: example
        run: |
          flutter pub get
          flutter analyze
          flutter test

  build:
    name: Build example (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: web, os: ubuntu-latest, command: 'flutter build web --release' }
          - { name: web (wasm), os: ubuntu-latest, command: 'flutter build web --release --wasm' }
          - { name: android, os: ubuntu-latest, command: 'flutter build apk --debug' }
          - { name: linux, os: ubuntu-latest, command: 'flutter build linux' }
          - { name: macos, os: macos-latest, command: 'flutter build macos' }
          - { name: ios, os: macos-latest, command: 'flutter build ios --debug --no-codesign' }
          - { name: windows, os: windows-latest, command: 'flutter build windows' }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        if: matrix.name == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - name: Linux build tools
        if: matrix.name == 'linux'
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        # The package index is sometimes slow; retry instead of hanging.
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -y \
              && sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
              && exit 0
            sleep 10
          done
          exit 1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable desktop
        run: flutter config --enable-linux-desktop --enable-macos-desktop --enable-windows-desktop
      - working-directory: example
        run: flutter pub get
      - working-directory: example
        run: ${{ matrix.command }}
