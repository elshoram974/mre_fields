name: mre_fields
description: >-
  Form fields for Flutter: a text field and a text widget that follow the
  language being typed (RTL and LTR), with clear button, suggestions and image
  paste. Themeable and localizable.
version: 0.1.0
repository: https://github.com/elshoram974/mre_fields
issue_tracker: https://github.com/elshoram974/mre_fields/issues
topics:
  - form
  - text-field
  - rtl
  - input
  - clipboard

environment:
  # No FVM. Lower bound keeps CashBook (3.44) able to path-depend;
  # Widget Previewer needs 3.38+.
  sdk: ^3.12.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.19.0
  pasteboard: ^0.5.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_lints: ^6.0.0
  path: ^1.9.1
