name: mre_fields
description: "Flutter form fields that follow the language typed (auto RTL/LTR text and alignment), phone numbers validated for every country with a picker, and image paste."
version: 0.3.3
repository: https://github.com/elshoram974/mre_fields
issue_tracker: https://github.com/elshoram974/mre_fields/issues
screenshots:
  - description: A text field and a plain text follow the language being typed.
    path: doc/images/text-direction.gif
  - description: A phone field checks the number for every country, finds the country from a pasted number, and opens a searchable picker.
    path: doc/images/phone-field.gif
  - description: Pasted images appear inside the field, inside the input border, with open, remove and replace.
    path: doc/images/image-paste.gif

topics:
  - form
  - text-field
  - rtl
  - input
  - phone-number

platforms:
  android:
  ios:
  web:
  windows:
  macos:
  linux:

environment:
  # No FVM. 3.38.1 is the first stable Flutter with Dart 3.10.0 and the oldest
  # one the test suite runs on (CI job "Minimum Flutter").
  sdk: ^3.10.0
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0
  pasteboard: ^0.5.0
  phone_numbers_parser: ^9.0.28
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_lints: ^6.0.0
  path: ^1.9.1
