name: mre_fields
description: "Reusable Flutter form field widgets for MRE apps — bidirectional text, phone with country code, and suggestions."
version: 0.0.1
homepage:

environment:
  # No FVM. Lower bound keeps CashBook (3.44) able to path-depend;
  # Widget Previewer needs 3.38+.
  sdk: ^3.12.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  pasteboard: ^0.5.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

